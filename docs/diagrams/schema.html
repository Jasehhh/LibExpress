<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LibExpress schema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=block" rel="stylesheet">
<link rel="stylesheet" href="diagram.css">
</head>
<body>
<main class="sheet" style="width:2090px">
  <header class="masthead">
    <div class="brand"><img src="../../public/logo.svg" alt=""><span>LibExpress</span></div>
    <div class="titles">
      <h1>Relational schema</h1>
      <p>The tables built from the ER diagram. Arrows run from a foreign key to the key it references, with <b>N</b> rows on the referencing side to <b>1</b> on the referenced side.</p>
    </div>
  </header>
  <svg id="schema" width="2090" height="1000" viewBox="0 170 2090 1000"></svg>
</main>
<script>
const C = {
  navy: "#182442", navyLight: "#d0dcf2", primary: "#00433d", primaryLight: "#2d847b",
  bg: "#fbf8fc", surface: "#ffffff", muted: "#636365", border: "#e4e1e5", fg: "#1b1b1e",
};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("schema");
function el(tag, attrs, parent = svg) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
}
function text(x, y, str, attrs = {}, parent = svg) {
  const t = el("text", { x, y, ...attrs }, parent);
  t.textContent = str;
  return t;
}

const W = 400, HEAD = 48, ROW = 30;
const COL = [60, 570, 1080, 1590];

// c: column, t: type, pk/fk flags
const tables = {
  author: { x: COL[0], y: 200, cols: [
    { c: "id", t: "uuid", pk: 1 },
    { c: "first_name", t: "text" },
    { c: "last_name", t: "text" } ] },
  book_author: { x: COL[1], y: 200, cols: [
    { c: "book_id", t: "uuid", pk: 1, fk: 1 },
    { c: "author_id", t: "uuid", pk: 1, fk: 1 } ] },
  book: { x: COL[2], y: 200, cols: [
    { c: "id", t: "uuid", pk: 1 },
    { c: "isbn", t: "varchar(13)" },
    { c: "title", t: "varchar(255)" },
    { c: "description", t: "text" },
    { c: "url", t: "text" },
    { c: "genre", t: "book_genre" },
    { c: "created_at", t: "timestamptz" } ] },
  fine: { x: COL[3], y: 200, cols: [
    { c: "id", t: "uuid", pk: 1 },
    { c: "loan_id", t: "uuid", fk: 1 },
    { c: "amount", t: "numeric(10,2)" },
    { c: "paid_at", t: "timestamptz" },
    { c: "created_at", t: "timestamptz" } ] },
  admin: { x: COL[0], y: 560, cols: [
    { c: "id", t: "uuid", pk: 1 },
    { c: "email", t: "text" },
    { c: "password_hash", t: "text" },
    { c: "created_at", t: "timestamptz" } ] },
  activity_log: { x: COL[1], y: 560, cols: [
    { c: "id", t: "uuid", pk: 1 },
    { c: "admin_id", t: "uuid", fk: 1 },
    { c: "action", t: "activity_action" },
    { c: "entity", t: "activity_entity" },
    { c: "entity_id", t: "uuid" },
    { c: "details", t: "jsonb" },
    { c: "created_at", t: "timestamptz" } ] },
  book_copy: { x: COL[2], y: 540, cols: [
    { c: "book_id", t: "uuid", pk: 1, fk: 1 },
    { c: "copy_no", t: "int4", pk: 1 },
    { c: "acquired_at", t: "timestamptz" },
    { c: "withdrawn_at", t: "timestamptz" } ] },
  loan: { x: COL[3], y: 540, cols: [
    { c: "id", t: "uuid", pk: 1 },
    { c: "book_id", t: "uuid", fk: 1 },
    { c: "copy_no", t: "int4", fk: 1 },
    { c: "member_id", t: "uuid", fk: 1 },
    { c: "checkout_date", t: "timestamptz" },
    { c: "due_date", t: "timestamptz" },
    { c: "return_date", t: "timestamptz" } ] },
  member: { x: COL[3], y: 920, cols: [
    { c: "id", t: "uuid", pk: 1 },
    { c: "email", t: "varchar(255)" },
    { c: "first_name", t: "text" },
    { c: "last_name", t: "text" },
    { c: "status", t: "member_status" },
    { c: "created_at", t: "timestamptz" } ] },
};
for (const T of Object.values(tables)) {
  T.h = HEAD + T.cols.length * ROW + 8;
}
const rowY = (t, c) => {
  const T = tables[t];
  return T.y + HEAD + 4 + T.cols.findIndex((x) => x.c === c) * ROW + ROW / 2;
};

// Foreign keys. Each is routed out of one side of the referencing table, along a
// vertical corridor, and into one side of the referenced table.
const fks = [
  { from: ["book_author", "book_id"], to: ["book", "id"], out: "right", in: "left", via: 1025 },
  { from: ["book_author", "author_id"], to: ["author", "id"], out: "left", in: "right", via: 515 },
  { from: ["book_copy", "book_id"], to: ["book", "id"], out: "left", in: "left", via: 1025, join: true },
  { from: ["activity_log", "admin_id"], to: ["admin", "id"], out: "left", in: "right", via: 515 },
  { from: ["loan", "book_id"], to: ["book_copy", "book_id"], out: "left", in: "right", via: 1535, pair: "copy_no" },
  { from: ["loan", "member_id"], to: ["member", "id"], out: "right", in: "right", via: 2030 },
  { from: ["fine", "loan_id"], to: ["loan", "id"], out: "right", in: "right", via: 2030 },
];

const defs = el("defs", {});
const pat = el("pattern", { id: "dots", width: 24, height: 24, patternUnits: "userSpaceOnUse" }, defs);
el("circle", { cx: 2, cy: 2, r: 1.1, fill: "#e4e1e5" }, pat);
const shadow = el("filter", { id: "shadow", x: "-10%", y: "-10%", width: "120%", height: "130%" }, defs);
el("feDropShadow", { dx: 0, dy: 6, stdDeviation: 8, "flood-color": C.navy, "flood-opacity": 0.1 }, shadow);
el("rect", { x: 0, y: 170, width: 2090, height: 1000, fill: "url(#dots)" });

const lineLayer = el("g", {});
const shapeLayer = el("g", {});
const labelLayer = el("g", {});

const sideX = (t, side) => (side === "left" ? tables[t].x : tables[t].x + W);
const ARROW = 12;

function route(fk, fromCol, toCol) {
  const sx = sideX(fk.from[0], fk.out), sy = rowY(fk.from[0], fromCol);
  const tx = sideX(fk.to[0], fk.in), ty = rowY(fk.to[0], toCol);
  const dirIn = fk.in === "left" ? 1 : -1; // direction the arrow travels into the target
  const ex = tx - dirIn * ARROW;
  return { sx, sy, tx, ty, ex, dirIn, d: `M${sx},${sy} H${fk.via} V${ty} H${ex}` };
}

for (const fk of fks) {
  const r = route(fk, fk.from[1], fk.to[1]);
  el("path", { d: r.d, fill: "none", stroke: C.navy, "stroke-width": 2, "stroke-linejoin": "round" }, lineLayer);
  if (fk.pair) {
    const r2 = route(fk, fk.pair, fk.pair);
    el("path", { d: r2.d, fill: "none", stroke: C.navy, "stroke-width": 2, "stroke-linejoin": "round" }, lineLayer);
    el("polygon", { points: `${r2.tx},${r2.ty} ${r2.ex},${r2.ty - 7} ${r2.ex},${r2.ty + 7}`, fill: C.navy }, lineLayer);
    // A bracket ties the two columns into one composite key.
    el("path", { d: `M${fk.via},${r.sy} V${r2.sy}`, stroke: C.navy, "stroke-width": 2 }, lineLayer);
  }
  if (fk.join) {
    el("circle", { cx: fk.via, cy: r.ty, r: 4.5, fill: C.navy }, lineLayer);
  } else {
    el("polygon", { points: `${r.tx},${r.ty} ${r.ex},${r.ty - 7} ${r.ex},${r.ty + 7}`, fill: C.navy }, lineLayer);
  }
  // Cardinality at each end: N where the FK sits, 1 at the key it references.
  const outDir = fk.out === "left" ? -1 : 1;
  text(r.sx + outDir * 12, r.sy - 7, "N", { class: "end", "text-anchor": outDir < 0 ? "end" : "start" }, labelLayer);
  if (!fk.join) text(r.tx - r.dirIn * 16, r.ty - 9, "1", { class: "end", "text-anchor": "middle" }, labelLayer);
  fk.r = r;
}

for (const [name, T] of Object.entries(tables)) {
  const g = el("g", {}, shapeLayer);
  el("rect", { x: T.x, y: T.y, width: W, height: T.h, rx: 10, fill: C.surface, stroke: C.border, filter: "url(#shadow)" }, g);
  el("path", { d: `M${T.x},${T.y + HEAD} V${T.y + 10} a10,10 0 0 1 10,-10 H${T.x + W - 10} a10,10 0 0 1 10,10 V${T.y + HEAD} Z`, fill: C.navy }, g);
  text(T.x + 18, T.y + 30, name, { class: "tname" }, g);

  T.cols.forEach((col, i) => {
    const top = T.y + HEAD + 4 + i * ROW, mid = top + ROW / 2;
    if (i % 2 === 1) el("rect", { x: T.x + 1, y: top, width: W - 2, height: ROW, fill: "#f7f5f8" }, g);
    const cx = T.x + 20;
    const t = text(cx, mid + 4.5, col.c, { class: col.pk ? "col pk" : "col" }, g);
    if (col.pk) {
      const w = t.getComputedTextLength();
      el("line", { x1: cx, y1: mid + 8, x2: cx + w, y2: mid + 8, stroke: C.fg, "stroke-width": 1.2 }, g);
    }
    if (col.fk) t.setAttribute("font-style", "italic");
    text(T.x + 190, mid + 4, col.t, { class: "type" }, g);
  });
}

// Legend
(function legend() {
  const x = 60, y = 900, w = 1420, h = 190;
  const g = el("g", {}, shapeLayer);
  el("rect", { x, y, width: w, height: h, rx: 12, fill: C.surface, stroke: C.border }, g);
  text(x + 24, y + 36, "How to read it", { class: "legend-title" }, g);
  const items = [
    [(cx, cy) => {
      const t = text(cx, cy + 5, "id", { class: "col pk" }, g);
      el("line", { x1: cx, y1: cy + 9, x2: cx + t.getComputedTextLength(), y2: cy + 9, stroke: C.fg, "stroke-width": 1.2 }, g);
    }, "Primary key column, underlined"],
    [(cx, cy) => { text(cx, cy + 5, "member_id", { class: "col", "font-style": "italic" }, g); },
      "Foreign key column, in italics"],
    [(cx, cy) => {
      el("line", { x1: cx, y1: cy, x2: cx + 44, y2: cy, stroke: C.navy, "stroke-width": 2 }, g);
      el("polygon", { points: `${cx + 56},${cy} ${cx + 44},${cy - 7} ${cx + 44},${cy + 7}`, fill: C.navy }, g);
    }, "Foreign key → the key it references"],
    [(cx, cy) => { text(cx, cy + 5, "N", { class: "end" }, g); text(cx + 46, cy + 5, "1", { class: "end" }, g); el("line", { x1: cx + 14, y1: cy, x2: cx + 40, y2: cy, stroke: C.navy, "stroke-width": 2 }, g); },
      "Many referencing rows to one referenced row"],
    [(cx, cy) => { el("circle", { cx: cx + 28, cy, r: 4.5, fill: C.navy }, g); }, "Two foreign keys meeting on the same key"],
  ];
  items.forEach(([draw, label], i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const cx = x + 24 + col * 680, cy = y + 78 + row * 38;
    draw(cx, cy);
    text(cx + 92, cy + 5, label, { class: "legend" }, g);
  });
})();
</script>
</body>
</html>
